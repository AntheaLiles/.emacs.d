version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  # Dépendance Python du banc de non-régression (requirements à hachages).
  - package-ecosystem: pip
    directory: /tests/regression
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
