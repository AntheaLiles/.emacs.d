name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elisp:
    name: Emacs Lisp (Emacs ${{ matrix.emacs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Version de référence : Emacs 31.1 ; snapshot pour anticiper.
        emacs: ["31.1", "snapshot"]
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Parenthèses et compilation à octets
        run: emacs -Q --batch -l scripts/check.el
      - name: Test ERT du collecteur de télémétrie
        run: |
          emacs -Q --batch \
            --eval '(setq my/perf-root (make-temp-file "perf-" t))' \
            -l perf/perf-start.el -l perf/perf-self-test.el \
            -f ert-run-tests-batch-and-exit
      - name: Tests ERT de l'export Org (PDF/UA, CSL, balisages)
        run: |
          emacs -Q --batch -L lisp -l tests/my-export-config-test.el \
            -f ert-run-tests-batch-and-exit
      - name: Tests ERT des modules (repliement, dépendances, init)
        run: |
          emacs -Q --batch -L lisp -l tests/my-config-test.el \
            -f ert-run-tests-batch-and-exit
