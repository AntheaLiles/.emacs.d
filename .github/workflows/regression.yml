name: Non-régression export

# Banc de bout en bout : essai.org → backend pdfua (processus asynchrone
# réel) → LuaLaTeX, en article-ua, book-ua et profil brouillon.
on:
  push:
    paths: ["lisp/**", "latex/**", "csl/**", "assets/**", "tests/regression/**", ".github/workflows/regression.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export PDF/UA (Emacs 31.1, LuaLaTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: "31.1"
      - name: TeX Live et polices de repli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-lang-french \
            texlive-fonts-recommended texlive-science texlive-plain-generic \
            latexmk fonts-dejavu-core fonts-lmodern fontconfig python3 python3-pip
      - name: Typst 0.15.1 (somme SHA-256 vérifiée)
        # Version et somme à mettre à jour ensemble.
        run: |
          curl -sSfL -o "$RUNNER_TEMP/typst.tar.xz" \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 \
            typst-x86_64-unknown-linux-musl/typst
          sudo install -m 0755 "$RUNNER_TEMP/typst" /usr/local/bin/typst
          typst --version
      - name: PyMuPDF (vérifications sur le PDF)
        run: >
          python3 -m pip install --user --break-system-packages --require-hashes
          -r tests/regression/requirements.txt
      - name: Banc de non-régression
        run: tests/regression/run.sh
