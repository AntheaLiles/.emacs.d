# SPDX-FileCopyrightText: 2026 AntheaLiles
# SPDX-License-Identifier: CC0-1.0
#
# Métadonnées REUSE pour les fichiers qui ne portent pas eux-mêmes
# d'en-tête SPDX. Les fichiers Lisp (.el) et LaTeX (.tex, latexmkrc)
# portent leur propre en-tête, qui reste la référence pour eux.
# Voir LICENSE.md pour la politique complète.

version = 1

# --- Documentation : GNU FDL 1.3 ou ultérieure ------------------------------
[[annotations]]
path = [
  "README.md",
  "LICENSE.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "perf/README.md",
  "docs/**",
  ".claude/CLAUDE.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 AntheaLiles"
SPDX-License-Identifier = "GFDL-1.3-or-later"

# --- Métadonnées et outillage du dépôt : CC0 (domaine public) ---------------
# Fichiers sans originalité notable (listes d'exclusion, gabarits GitHub,
# réglages d'outils) : CC0 évite d'imposer une licence à qui les réutilise.
[[annotations]]
path = [
  "CITATION.cff",
  ".editorconfig",
  ".github/**",
  ".claude/settings.json",
  ".claude/commands/**",
  "ispell-personal",  # dictionnaire personnel hunspell (lisp/my-editing.el)
  "tests/regression/essai.org",        # document d'essai du banc
  "tests/regression/references.json",  # références fictives du banc
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 AntheaLiles"
SPDX-License-Identifier = "CC0-1.0"

# --- Snippets yasnippet : code d'édition, même licence que le Lisp ---------
[[annotations]]
path = "snippets/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 AntheaLiles"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# --- Ressources graphiques --------------------------------------------------
# À compléter au cas par cas lors de l'ajout d'une image : les logos de
# tiers relèvent de leurs propres conditions et sont déclarés ici avec
# leur titulaire réel.
#
# Icônes ORCID iD (\orcidlink et \orcidlinkunauth du préambule) : marque
# d'ORCID, Inc., employée selon ses règles d'affichage des identifiants.
[[annotations]]
path = "assets/ORCID-iD-icon-*.png"
precedence = "override"
SPDX-FileCopyrightText = "ORCID, Inc."
SPDX-License-Identifier = "LicenseRef-ORCID-Trademark"

# --- Style et locale CSL -----------------------------------------------------
# Style : adaptation du style IEEE du dépôt CSL de Zotero (CC BY-SA 3.0),
# distribuée sous CC BY-SA 4.0, version ultérieure de la même licence comme
# le permet son article 4(b).  Locale française du projet CSL : inchangée,
# CC BY-SA 3.0.
[[annotations]]
path = "csl/iso-ieee-localised-collapsed.csl"
precedence = "override"
SPDX-FileCopyrightText = [
  "Michael Berkowitz, Julian Onions, Rintze Zelle, Stephen Frank, Sebastian Karcher, Giuseppe Silano, Patrick O'Brien, Brenton M. Wiernik, Oliver Couch",
  "2026 Cyprien Pierre",
]
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "csl/locales/**"
precedence = "override"
SPDX-FileCopyrightText = "Citation Style Language project contributors"
SPDX-License-Identifier = "CC-BY-SA-3.0"
